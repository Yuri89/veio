# Troque exemplo.com.br pelo seu domínio (3 lugares).
limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connip:10m;

# Qualquer Host desconhecido (varredura por IP, domínio alheio) é descartado.
server { listen 8080 default_server; server_name _; return 444; }
server { listen 8443 ssl default_server; server_name _; ssl_reject_handshake on; }

server {
  listen 8080;
  server_name exemplo.com.br www.exemplo.com.br;
  server_tokens off;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://exemplo.com.br$request_uri; }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name exemplo.com.br www.exemplo.com.br;
  server_tokens off;

  # TLS
  ssl_certificate     /etc/letsencrypt/live/exemplo.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/exemplo.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 9.9.9.9 valid=300s;

  # Anti-abuso: site 100% leitura, sem corpo de requisição
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  client_max_body_size 0;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  keepalive_timeout 15s;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;
  limit_req zone=perip burst=60 nodelay;
  limit_req_status 429;
  limit_conn connip 30;

  # Entrega
  root /usr/share/nginx/html;
  index index.html;
  sendfile on;
  tcp_nopush on;
  gzip_static on;          # serve os .gz gerados no build, sem custo de CPU
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  open_file_cache max=200 inactive=60s;
  open_file_cache_valid 120s;
  etag on;

  include /etc/nginx/headers.conf;

  location ~ /\. { return 404; }   # dotfiles

  # Arquivos com hash no nome nunca mudam: cache de 1 ano.
  location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/headers.conf;
    try_files $uri =404;
  }

  # HTML e demais arquivos revalidam (ETag), então um deploy novo aparece na hora.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/headers.conf;
    try_files $uri /index.html;
  }
}
